version: '3.8'

services:
  db:
    image: postgres:13-alpine
    container_name: rag_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=ragdb
    ports:
      - "5432:5432"
    networks:
      - app_net
    restart: unless-stopped

  auth-service:
    build:
      context: ./service
      dockerfile: Dockerfile
    container_name: auth-service
    # auth_service가 DB에 연결하기 위한 환경변수.
    # 실제 auth_service 코드에 맞게 변수명을 조정해야 할 수 있습니다.
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/ragdb
    depends_on:
      - db
    networks:
      - app_net
    restart: unless-stopped

  chatbot-service:
    build:
      context: ./service/chatbot_service
      dockerfile: Dockerfile
    container_name: chatbot-service
    env_file:
      - ./service/chatbot_service/.env
    # Linux에서는 다음 설정이 필요할 수 있습니다.
    # extra_hosts:
    #  - "host.docker.internal:host-gateway"
    networks:
      - app_net
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "8000:8000"
    environment:
      - CHATBOT_SERVICE_URL=http://chatbot-service:8001
      # - AUTH_SERVICE_URL=http://auth-service:8081 # 필요시 활성화
    depends_on:
      - chatbot-service
      - auth-service
    networks:
      - app_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      # Next.js 앱이 게이트웨이에 접근할 수 있도록 URL을 전달합니다.
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - gateway
    networks:
      - app_net
    restart: unless-stopped

networks:
  app_net:
    driver: bridge

volumes:
  postgres_data:
